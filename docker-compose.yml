version: '3'
services:
  app:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
    environment:
      - MONGO_URI=mongodb://mongo:27017/isp_management_system
      - REDIS_HOST=redis
      - REDIS_PORT=6379
  mongo:
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  redis:
    image: redis:6
    ports:
      - "6379:6379"

volumes:
  mongo-data:

